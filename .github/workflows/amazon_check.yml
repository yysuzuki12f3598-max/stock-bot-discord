name: Amazon Price Monitor

on:
  # 💡 定期実行スケジュール（30分おきなどに設定可能）
  schedule:
    - cron: '*/30 * * * *'
  # 💡 GitHubの画面から手動でいつでも起動できるボタンを有効化
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    
    strategy:
      # 💡 trueにすると、1つの商品がエラー落ちした時に他の並列処理も道連れで止まってしまうので、必ずfalseにします
      fail-fast: false
      matrix:
        product: [
          { 
            name: "ブラキオウィップセレクト", 
            url: "https://www.amazon.co.jp/dp/B0H1B5QDJK", 
            max_price: 1600 
          },
          { 
            name: "ランダムブースター V10", 
            url: "https://www.amazon.co.jp/dp/B0GWKWBXH3", 
            max_price: 1600 
          },
          { 
            name: "テスト", 
            url: "https://www.amazon.co.jp/dp/B004Y9IXZW", 
            max_price: 99999 
          }
        ]

    steps:
    # 1. リポジトリのコードをチェックアウト
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Python環境のセットアップ
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    # 3. 必要なライブラリのインストール
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    # 4. パラレルでPythonスクリプトを実行
    # 💡 引数の展開バグを防ぐため、シングルクォーテーションで厳重に囲ってPythonへ引き渡します
    - name: Run Price Monitor
      env:
        WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      run: |
        python main.py '${{ matrix.product.url }}' '${{ matrix.product.max_price }}' '${{ matrix.product.name }}'