name: Amazon Price Monitor

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    
    # 💡 ジョブ全体で使う環境変数をここで一括宣言します。これで100%Python側に伝わります！
    env:
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
    
    strategy:
      fail-fast: false
      matrix:
        product: [
          { 
            name: "ブラキオウィップセレクト", 
            url: "https://www.amazon.co.jp/dp/B0H1B5QDJK", 
            max_price: 1600 
          },
          { 
            name: "ランダムブースター V10", 
            url: "https://www.amazon.co.jp/dp/B0GWKWBXH3", 
            max_price: 1600 
          },
          { 
            name: "テスト", 
            url: "https://www.amazon.co.jp/dp/B004Y9IXZW", 
            max_price: 99999 
          }
        ]

    steps:
    # 1. リポジトリのコードをチェックアウト
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Python環境のセットアップ
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 3. 必要なライブラリのインストール
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    # 4. パラレルでPythonスクリプトを実行
    - name: Run Price Monitor
      run: |
        python main.py '${{ matrix.product.url }}' '${{ matrix.product.max_price }}' '${{ matrix.product.name }}'